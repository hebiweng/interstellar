schema_version: 1.0.0
catalog_id: interstellar.render_catalog.v1
title_zh: Interstellar 全量图形目录
authoritative_for: [view_id, view_number, render_family, result_dependencies, release_scope]

entry_contract:
  required_fields: [number, view_id, name_zh, family, target_release, capability_id, result_dependencies, renderer]
  acceptance:
    - deterministic_from_snapshot_and_render_spec
    - stable_semantic_ids
    - keyboard_and_screen_reader_fallback
    - color_blind_safe_palette
    - visual_regression_fixture
    - export_or_data_fallback
  release_values: [alpha, beta, pro, v1, post_v1_consumer]
  renderer_values: [svg, canvas, webgl, table, graph, timeline, calendar, map]

release_policy:
  professional_v1: "编号1—128属于专业平台V1基线；可按成熟度发布为Stable、Beta或Experimental。"
  consumer_later: "编号129—146登记在总目录中，但因V1不含消费者模式，目标阶段为post_v1_consumer。"
  no_silent_drop: "未完成条目必须在OutputManifest中标为blocked或degraded，不得从目录静默删除。"

