known_limits:
  - M4 UI executes the virtual-sample vertical slice only; real subject forms, location resolution and SubjectVersion persistence enter M5-M6.
  - User-editable calculation parameters and output selection are intentionally read-only until their server contracts are wired in M5.
  - The JobStore is in memory; database persistence, real queue transport and multi-process recovery are not yet production-ready.
  - Job completion currently produces an explicitly partial non-astronomical result; real M5 calculation workers will replace it.
  - Only 35 view registrations are currently exposed while the 146-item roadmap remains contract-validated for M24 completion.
  - Independent JPL position validation remains absent, so astronomical results stay Experimental.
