objective: optional_AI_analysis_is_an_explicitly_consented_isolated_consumer_of_the_immutable_technical_document_and_never_an_astrology_calculator
default_runtime_state:
  providers_configured: 0
  submission_enabled: false
  manual_copy_and_download_available: true
provider_families:
