    proves: provider_catalog_preview_hash_consent_authority_secret_isolation_test_executor_and_independent_artifact_contract
  - path: apps/api/interstellar_api/errors.py
    proves: stable_AI_payload_changed_provider_not_configured_and_consent_error_codes
  - path: app/page.tsx
    proves: provider_changes_invalidate_consent_preview_is_required_and_manual_fallback_remains_available
  - path: tests/backend/test_m2_calculation_api.py
    proves: unconfigured_runtime_and_configured_fake_executor_paths_are_tested_without_real_third_party_calls
  - path: tests/rendered-html.test.mjs
    proves: visible_preview_authority_consent_integrity_and_disabled_state_contract
verification:
  result: passed
  browser_checks:
    - preview_generated_without_sending_any_data
    - destination_says_unconfigured_and_no_data_will_be_sent
    - document_hash_matches_the_technical_export
    - consent_checkboxes_unlock_only_after_preview
    - submit_remains_disabled_for_unconfigured_provider
  visual_artifact: output/playwright/natal-technical-ai-preview.png
release_note: this_gate_does_not_claim_that_OpenAI_Moonshot_or_any_other_real_provider_is_connected
