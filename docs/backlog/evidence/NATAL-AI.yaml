  - {id: moonshot, display_name: Kimi / Moonshot, default_status: not_configured}
preview_contract:
  discloses:
    - provider_and_exact_model
    - document_format_character_and_token_estimate
    - document_and_payload_hashes
    - included_sections_and_excerpt
    - destination_privacy_and_retention
    - independent_response_storage_boundary
  network_effect: no_provider_request
submission_contract:
  required_confirmations:
    - authority_for_subject_data
    - consent_to_exact_payload_hash
  changed_payload_after_consent: rejected
  unconfigured_provider: rejected
  response_storage: independent_optional_AI_artifact
  calculation_writeback: forbidden
evidence:
