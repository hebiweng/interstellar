known_limits:
  - Independent JPL position and independent house-engine fixtures remain absent, so astronomical and house results remain Experimental rather than Stable.
  - Dynamic aspect entry, exact-hit and exit times are M5 scope.
  - Minor, harmonic, declination, latitude and mirror aspects are later Beta/V1 scope.
  - Hemisphere distributions, Jones shapes and geometric aspect patterns are later Beta scope.
  - The local repository still uses an explicitly recorded Moshier fallback because licensed Swiss ephemeris files are not bundled.
  - Inline anonymous ChartRequest subjects remain explicitly rejected until durable anonymous normalization is wired.
