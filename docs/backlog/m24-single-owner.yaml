global_exit_gate:
  required:
    - all_required_catalog_ids_reachable
    - schemas_and_openapi_parse
    - generated_types_match
    - algorithm_cards_covered
    - dataset_licenses_and_attribution_complete
    - gold_and_differential_tests_pass_or_maturity_degraded
    - visual_catalog_1_128_implemented_or_explicitly_degraded
    - no_unlinked_report_conclusion
    - backup_restore_rehearsed
    - known_limits_published
