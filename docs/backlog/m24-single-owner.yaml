schema_version: 1.0.0
backlog_id: interstellar.m24.single_owner.v1
accountable_owner: interstellar_primary_agent
execution_model:
  human_or_agent_owners: 1
  parallel_subagents: allowed
  merge_authority: accountable_owner_only
  source_of_truth:
    calculations: docs/calculation-catalog.yaml
    views: docs/render-catalog.yaml
    capabilities: docs/capabilities.yaml
    models_and_reports: docs/analysis-catalog.yaml
    algorithms: algorithm-cards/catalog.yaml
  monthly_rule: no_month_closes_with_failed_required_gate
  maturity_rule: specification_approved_is_not_implementation_or_stable

lanes:
  - {id: contract, owns: [schema, openapi, types, migrations]}
  - {id: computation, owns: [adapters, calculations, algorithms, differential_tests]}
  - {id: product, owns: [workflow, recipe, reports, ui, renderers]}
  - {id: platform, owns: [jobs, storage, security, datasets, operations]}
  - {id: quality, owns: [gold, contracts, visual, performance, release_gates]}

months:
  - month: M0
    objective: 把原型仓库变为可持续开发的规范化Monorepo
    tasks:
      - {id: M0-001, lane: contract, deliverable: 根Sites_Web包_apps/api_apps/worker_packages目录与锁文件, acceptance: web_api_worker均可独立启动}
      - {id: M0-002, lane: platform, deliverable: Compose启动PostgreSQL_PostGIS_Redis_MinIO_Mailpit, acceptance: 健康检查全部通过}
      - {id: M0-003, lane: quality, deliverable: CI执行catalog_schema_openapi_lint_unit_build, acceptance: 任一契约漂移阻断合并}
      - {id: M0-004, lane: contract, deliverable: CanonicalSchema与OpenAPI基线, acceptance: JSON_YAML引用可解析}
  - month: M1
    objective: 完成对象、时间、地点、数据版本和持久化基础
    tasks:
      - {id: M1-001, lane: contract, deliverable: Alembic核心表_RLS_不可变触发器, acceptance: 跨workspace访问被拒绝且版本不可更新}
      - {id: M1-002, lane: computation, deliverable: TimeSpec与DST候选, acceptance: 正常_重叠_空洞_未知时间金标准通过}
      - {id: M1-003, lane: computation, deliverable: GeoNames与时区边界导入, acceptance: 地名消歧_边界候选_海域降级通过}
      - {id: M1-004, lane: platform, deliverable: DatasetVersion_Manifest_许可证台账, acceptance: 每次计算能固定活动数据版本}
  - month: M2
    objective: 建立星历适配器和Canonical计算流水线
    catalog_scope: calculation.target_release in [foundation, alpha]
    tasks:
      - {id: M2-001, lane: computation, deliverable: SwissEphemerisAdapter与JPL差异框架, acceptance: Sun_Moon_主要行星位置进入Canonical结果}
      - {id: M2-002, lane: computation, deliverable: UTC_JD_DeltaT_运动状态_月相, acceptance: 数值_单位_标志_数据版本完整}
      - {id: M2-003, lane: contract, deliverable: CalculationSnapshot不可变存储, acceptance: 相同指纹可复现且旧快照不覆盖}
      - {id: M2-004, lane: quality, deliverable: 首批天文金标准与差异报告, acceptance: 达到算法卡容差或显式阻断Stable}
  - month: M3
    objective: 完成本命基础事实
    tasks:
      - {id: M3-001, lane: computation, deliverable: ASC_MC_12宫与高纬策略, acceptance: 宫头与独立实现差异通过}
      - {id: M3-002, lane: computation, deliverable: 主要相位_入出相_容许度, acceptance: 圆周与交换属性测试通过}
      - {id: M3-003, lane: computation, deliverable: 元素_模式_阴阳统计, acceptance: 权重Preset与原始计数同时返回}
      - {id: M3-004, lane: product, deliverable: 位置_宫位_相位_统计数据表, acceptance: 只消费Snapshot且可CSV_JSON导出}
  - month: M4
    objective: 打通六类入口到不可变Recipe
    tasks:
      - {id: M4-001, lane: product, deliverable: AnalysisModel_TopicModel_Intent注册表, acceptance: 12_24_35数量和引用一致}
      - {id: M4-002, lane: product, deliverable: AnalysisDraft与RecipeResolver, acceptance: 六入口等价_DAG去重_阻断_预算测试通过}
      - {id: M4-003, lane: platform, deliverable: Job_SSE_取消_重试_租约, acceptance: 状态机E2E与故障恢复通过}
      - {id: M4-004, lane: contract, deliverable: /api/v1核心接口与SDK生成, acceptance: OpenAPI契约测试通过}
  - month: M5
