schema_version: 1.0.0
document_version: 1.0.0-draft.1
product: interstellar
baseline_date: 2026-07-17
license_strategy: agpl_open_source

policy:
  v1_duration_months: 24
  professional_alpha_month: 6
  zero_crawler: true
  anonymous_calculation_persistence: none_by_default
  canonical_schema_owner: interstellar
  stable_gate:
    - approved_algorithm_card_when_required
    - unit_and_property_tests
    - gold_fixture_tests
    - independent_differential_tests
    - professional_review
    - reproducible_version_metadata
    - public_documentation
  maturity_levels:
    stable: Public API compatibility and professional validation are complete.
    beta: Implemented and tested, but some boundary validation or professional review remains.
    experimental: Research capability with explicit warnings and no compatibility promise.

phases:
  foundation:
    months: [0, 1]
    release: internal
  alpha:
    months: [2, 6]
    release: professional_alpha
  beta:
    months: [7, 12]
    release: professional_beta
  pro:
    months: [13, 18]
    release: professional_pro
  v1:
    months: [19, 24]
    release: v1
  post_v1:
    months: null
    release: future

data_sources:
  swiss_ephemeris:
    name: Swiss Ephemeris
    url: https://www.astro.com/swisseph/swephinfo_e.htm
    acquisition: official_release
    runtime_mode: local_versioned_files
    license: AGPL-3.0-or-later OR Professional License
    v1_choice: AGPL-3.0-or-later
    cost_v1: free
    required_for_v1: true
    notes: Closed-source or AGPL-incompatible operation requires the professional license.
  jpl_spice:
    name: NASA/JPL NAIF SPICE
    url: https://naif.jpl.nasa.gov/naif/public.html
    acquisition: official_kernel
    runtime_mode: local_validation_kernel
    license: publicly_available_with_credit_requirements
    cost_v1: free
    required_for_v1: true
    notes: Independent astronomical validation; not the astrology semantic engine.
  iana_tzdb:
    name: IANA Time Zone Database
    url: https://www.iana.org/time-zones
    acquisition: official_release
    runtime_mode: local_versioned_database
    license: public_tzdb_distribution
    cost_v1: free
    required_for_v1: true
    baseline_version: 2026c
  timezone_boundary_builder:
    name: Timezone Boundary Builder
    url: https://github.com/evansiroky/timezone-boundary-builder
    acquisition: github_release
    runtime_mode: postgis_local
    license: ODbL-1.0-output_AND_MIT-code
    cost_v1: free
    required_for_v1: true
  geonames:
    name: GeoNames
    url: https://download.geonames.org/export/dump/
    acquisition: official_dump
    runtime_mode: postgresql_local
    license: CC-BY-4.0
    cost_v1: free
    required_for_v1: true
  natural_earth:
    name: Natural Earth
    url: https://www.naturalearthdata.com/about/terms-of-use/
    acquisition: official_package
    runtime_mode: local_map_assets
    license: public_domain
    cost_v1: free
    required_for_v1: true
  openstreetmap:
    name: OpenStreetMap
    url: https://www.openstreetmap.org/copyright
    acquisition: self_hosted_extract_or_replaceable_provider
    runtime_mode: replaceable_map_adapter
    license: ODbL-1.0
    cost_v1: data_free_service_may_cost
    required_for_v1: false
    notes: Public Nominatim is not used for autocomplete, bulk geocoding, or production dependency.
  iers:
    name: IERS Bulletins
    url: https://data.iers.org/bulletins.php
    acquisition: official_bulletin
    runtime_mode: local_versioned_data
    license: official_public_data
    cost_v1: free
    required_for_v1: true
  minor_planet_center:
    name: Minor Planet Center mpc_orb
    url: https://docs.minorplanetcenter.net/software/
    acquisition: official_json_or_api
    runtime_mode: common_local_long_tail_cache
    license: official_data_terms
    cost_v1: free
    required_for_v1: false
  gaia_dr3:
    name: ESA Gaia DR3
    url: https://gea.esac.esa.int/archive/documentation/GDR3/index.html
    acquisition: official_tap_or_archive
    runtime_mode: common_local_long_tail_cache
    license: open_with_ESA_Gaia_DPAC_credit
    cost_v1: free
    required_for_v1: false
  nasa_eclipse:
    name: NASA Eclipse Catalogs
    url: https://eclipse.gsfc.nasa.gov/eclipse.html
    acquisition: official_catalog
    runtime_mode: validation_fixture
    license: reproducible_with_required_acknowledgement
    cost_v1: free
    required_for_v1: false
  wikidata:
    name: Wikidata
    url: https://www.wikidata.org/wiki/Wikidata:Licensing
    acquisition: official_dump_or_api
    runtime_mode: curated_reference_cases
    license: CC0-1.0-structured-data
    cost_v1: free
    required_for_v1: false
  authorized_birth_data:
    name: Authorized exact birth-time dataset
    url: null
    acquisition: written_authorization_only
    runtime_mode: curated_reference_cases
    license: to_be_negotiated
    cost_v1: unavailable
    required_for_v1: false
    phase: post_v1
  commercial_map_service:
    name: Commercial map and geocoding service
    url: null
    acquisition: procurement
    runtime_mode: replaceable_map_adapter
    license: commercial_contract
    cost_v1: optional
    required_for_v1: false

validation_profiles:
  platform_stable:
    - unit
    - contract
    - integration
    - security
    - e2e
  astronomy_stable:
    - unit
    - property
    - gold
    - differential_jpl
    - professional_review
  astrology_stable:
    - unit
    - property
    - gold
    - differential_astrology
    - professional_review
  astrology_beta:
    - unit
    - property
    - gold
    - differential_astrology
  rendering_stable:
    - unit
    - visual_regression
    - accessibility
    - export_round_trip
  research_experimental:
    - unit
    - explicit_warning
    - provenance

capabilities:
