schema_version: 1.3.0
document_version: 1.3.0-draft.1
product: interstellar
baseline_date: 2026-07-18
license_strategy: agpl_open_source

normative_catalogs:
  analysis_registry:
    path: docs/analysis-catalog.yaml
    authority: entry_point_topic_model_analysis_intent_recipe_and_report_contract
    base_analysis_models: 12
    topic_models: 24
    analysis_intents: 35
    report_profiles: 6
  calculation_registry:
    path: docs/calculation-catalog.yaml
    authority: calculation_id_capability_owner_release_and_result_contract
    total_calculations: 99
    professional_v1_releases: [alpha, beta, pro, v1]
  calculation_results:
    path: docs/calculation-result-catalog.md
    authority: field_algorithm_boundary_and_null_semantics
  render_views:
    path: docs/render-catalog.yaml
    authority: view_id_and_result_dependency
    total_views: 146
    professional_v1_range: [1, 128]
    post_v1_consumer_range: [129, 146]

catalog_coverage_policy:
  calculation_completion_requires: [schema, algorithm_card, tests, maturity, output_manifest, render_or_table_consumer]
  view_completion_requires: [result_dependency, renderer, visual_regression, accessibility_fallback, export_or_data_fallback]
  missing_required_item: explicit_blocked_or_degraded
  silent_catalog_omission: forbidden
  build_checks: [unique_calculation_ids, unique_view_ids, contiguous_view_numbers, known_capability_owners, release_scope_consistency]

policy:
  v1_duration_months: 24
  professional_alpha_month: 6
  zero_crawler: true
  anonymous_calculation_persistence: none_by_default
  canonical_schema_owner: interstellar
  stable_gate:
    - approved_algorithm_card_when_required
    - unit_and_property_tests
    - gold_fixture_tests
    - independent_differential_tests
    - professional_review
    - reproducible_version_metadata
    - public_documentation
  maturity_levels:
    stable: Public API compatibility and professional validation are complete.
    beta: Implemented and tested, but some boundary validation or professional review remains.
    experimental: Research capability with explicit warnings and no compatibility promise.

phases:
  foundation:
    months: [0, 1]
    release: internal
  alpha:
    months: [2, 6]
    release: professional_alpha
  beta:
    months: [7, 12]
    release: professional_beta
  pro:
    months: [13, 18]
    release: professional_pro
  v1:
    months: [19, 24]
    release: v1
  post_v1:
    months: null
    release: future

data_sources:
  swiss_ephemeris:
    name: Swiss Ephemeris
    url: https://www.astro.com/swisseph/swephinfo_e.htm
    acquisition: official_release
    runtime_mode: local_versioned_files
    license: AGPL-3.0-or-later OR Professional License
    v1_choice: AGPL-3.0-or-later
    cost_v1: free
    required_for_v1: true
    notes: Closed-source or AGPL-incompatible operation requires the professional license.
  jpl_spice:
    name: NASA/JPL NAIF SPICE
    url: https://naif.jpl.nasa.gov/naif/public.html
    acquisition: official_kernel
    runtime_mode: local_validation_kernel
    license: publicly_available_with_credit_requirements
    cost_v1: free
    required_for_v1: true
    notes: Independent astronomical validation; not the astrology semantic engine.
  iana_tzdb:
    name: IANA Time Zone Database
    url: https://www.iana.org/time-zones
    acquisition: official_release
    runtime_mode: local_versioned_database
    license: public_tzdb_distribution
    cost_v1: free
    required_for_v1: true
    baseline_version: 2026c
  timezone_boundary_builder:
    name: Timezone Boundary Builder
    url: https://github.com/evansiroky/timezone-boundary-builder
    acquisition: github_release
    runtime_mode: postgis_local
    license: ODbL-1.0-output_AND_MIT-code
    cost_v1: free
    required_for_v1: true
  geonames:
    name: GeoNames
    url: https://download.geonames.org/export/dump/
    acquisition: official_dump
    runtime_mode: postgresql_local
    license: CC-BY-4.0
    cost_v1: free
    required_for_v1: true
  natural_earth:
    name: Natural Earth
    url: https://www.naturalearthdata.com/about/terms-of-use/
    acquisition: official_package
    runtime_mode: local_map_assets
    license: public_domain
    cost_v1: free
    required_for_v1: true
  openstreetmap:
    name: OpenStreetMap
    url: https://www.openstreetmap.org/copyright
    acquisition: self_hosted_extract_or_replaceable_provider
    runtime_mode: replaceable_map_adapter
    license: ODbL-1.0
    cost_v1: data_free_service_may_cost
    required_for_v1: false
    notes: Public Nominatim is not used for autocomplete, bulk geocoding, or production dependency.
  iers:
    name: IERS Bulletins
    url: https://data.iers.org/bulletins.php
    acquisition: official_bulletin
    runtime_mode: local_versioned_data
    license: official_public_data
    cost_v1: free
    required_for_v1: true
  minor_planet_center:
    name: Minor Planet Center mpc_orb
    url: https://docs.minorplanetcenter.net/software/
    acquisition: official_json_or_api
    runtime_mode: common_local_long_tail_cache
    license: official_data_terms
    cost_v1: free
    required_for_v1: false
  gaia_dr3:
    name: ESA Gaia DR3
    url: https://gea.esac.esa.int/archive/documentation/GDR3/index.html
    acquisition: official_tap_or_archive
    runtime_mode: common_local_long_tail_cache
    license: open_with_ESA_Gaia_DPAC_credit
    cost_v1: free
    required_for_v1: false
  nasa_eclipse:
    name: NASA Eclipse Catalogs
    url: https://eclipse.gsfc.nasa.gov/eclipse.html
    acquisition: official_catalog
    runtime_mode: validation_fixture
    license: reproducible_with_required_acknowledgement
    cost_v1: free
    required_for_v1: false
  wikidata:
    name: Wikidata
    url: https://www.wikidata.org/wiki/Wikidata:Licensing
    acquisition: official_dump_or_api
    runtime_mode: curated_reference_cases
    license: CC0-1.0-structured-data
    cost_v1: free
    required_for_v1: false
  authorized_birth_data:
    name: Authorized exact birth-time dataset
    url: null
    acquisition: written_authorization_only
    runtime_mode: curated_reference_cases
    license: to_be_negotiated
    cost_v1: unavailable
    required_for_v1: false
    phase: post_v1
  commercial_map_service:
    name: Commercial map and geocoding service
    url: null
    acquisition: procurement
    runtime_mode: replaceable_map_adapter
    license: commercial_contract
    cost_v1: optional
    required_for_v1: false

validation_profiles:
  platform_stable:
    - unit
    - contract
    - integration
    - security
    - e2e
  astronomy_stable:
    - unit
    - property
    - gold
    - differential_jpl
    - professional_review
  astrology_stable:
    - unit
    - property
    - gold
    - differential_astrology
    - professional_review
  astrology_beta:
    - unit
    - property
    - gold
    - differential_astrology
  rendering_stable:
    - unit
    - visual_regression
    - accessibility
    - export_round_trip
  research_experimental:
    - unit
    - explicit_warning
    - provenance

analysis_model_policy:
  registry_capability: platform.analysis_model_registry
  builtin_versions_immutable: true
  approved_model_card_required_for_stable: true
  model_version_in_calculation_fingerprint: true
  maturity_cannot_exceed_required_components: true
  required_component_failure: block
  optional_component_failure: explicit_degradation
  unknown_birth_time_default: never_assume_midnight
  custom_model_mode: validated_declarative_components_only
  availability_states: [available, degraded, blocked]
  forbidden_outputs: [objective_event_probability, guaranteed_outcome, opaque_luck_score]

analysis_recipe_policy:
  resolver_capability: platform.analysis_recipe_resolver
  entry_points: 6
  preflight_required: true
  required_dependencies: backend_locked
  recommended_defaults: user_changeable
  optional_extensions: user_selected
  blocked_items_remain_visible: true
  compute_all_on_page_open: false
  reachability_gate: [direct_entry, dependency, analysis_recipe]

topic_and_report_policy:
  topic_models: 24
  analysis_intents: 35
  topic_model_core_recipe_immutable: true
  core_change_requires_custom_model_spec: true
  formal_report_requires_report_rule_pack: true
  report_profiles: 6
  report_densities: [summary, standard, full_technical]
  report_layers: [RawFact, Evidence, Finding, Conclusion, ReportSection, ReportDocument]
  proprietary_models_executable_without_license: false

