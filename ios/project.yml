name: Interstellar

options:
  bundleIdPrefix: com.xiaoguiwk
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  AstroCore:
    path: Packages/AstroCore
  ContentKit:
    path: Packages/ContentKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  Interstellar:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../vendor/swisseph/ephe
        type: folder
        buildPhase: resources
      - path: Packages/AstroCore/Sources/CSwissEphemeris/LICENSE
        buildPhase: resources
      - path: Packages/AstroCore/Sources/CSwissEphemeris/agpl-3.0.txt
        buildPhase: resources
    dependencies:
      - package: AstroCore
      - package: ContentKit
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/Interstellar.entitlements
        DEVELOPMENT_TEAM: YD3FY9ZB52
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoguiwk.interstellar
        PRODUCT_NAME: Interstellar
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Interstellar
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Interstellar uses your location only when you request it, to calculate local chart angles and houses.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          APP_ATTEST_ENVIRONMENT: development
        Release:
          APP_ATTEST_ENVIRONMENT: production
    postBuildScripts:
      - name: Validate Content and Localization
        script: |
          set -eu
          cd "$SRCROOT/.."
          export PATH=~/.local/bin:/opt/homebrew/bin:/usr/local/bin:$PATH
          command -v node >/dev/null 2>&1 || { echo "node not found in PATH=$PATH" >&2; exit 1; }
          node scripts/build-ios-copy-catalog.mjs --validate-runtime ios/App/Resources/CopyCatalog-en.json
          node scripts/build-ios-copy-catalog.mjs --validate-runtime ios/App/Resources/CopyCatalog-zh-Hans.json
          node scripts/build-ios-copy-catalog.mjs --validate-runtime ios/App/Resources/CopyCatalog-es.json
          node scripts/build-ios-copy-catalog.mjs --validate-runtime ios/App/Resources/CopyCatalog-fr.json
          node scripts/build-ios-localization.mjs --validate
        inputFiles:
          - $(SRCROOT)/App/Resources/CopyCatalog-en.json
          - $(SRCROOT)/App/Resources/CopyCatalog-zh-Hans.json
          - $(SRCROOT)/App/Localizable.xcstrings
          - $(SRCROOT)/App/Resources/AstroTerms-en.json
          - $(SRCROOT)/App/Resources/AstroTerms-zh-Hans.json
          - $(SRCROOT)/App/Resources/AstroTerms-es.json
          - $(SRCROOT)/App/Resources/AstroTerms-fr.json
          - $(SRCROOT)/Localization/ui-translations.json
          - $(SRCROOT)/ContentSchema/copy-catalog.schema.json
    scheme:
      gatherCoverageData: true
      testTargets:
        - InterstellarTests
        - InterstellarUITests
  InterstellarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Interstellar
      - package: AstroCore
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YD3FY9ZB52
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoguiwk.interstellar.tests
        GENERATE_INFOPLIST_FILE: YES
  InterstellarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Interstellar
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YD3FY9ZB52
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoguiwk.interstellar.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Interstellar
