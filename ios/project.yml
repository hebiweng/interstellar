name: Interstellar

options:
  bundleIdPrefix: com.xiaoguiwk
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  AstroCore:
    path: Packages/AstroCore
  ContentKit:
    path: Packages/ContentKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  Interstellar:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../vendor/swisseph/ephe
        type: folder
        buildPhase: resources
      - path: Packages/AstroCore/Sources/CSwissEphemeris/LICENSE
        buildPhase: resources
      - path: Packages/AstroCore/Sources/CSwissEphemeris/agpl-3.0.txt
        buildPhase: resources
    dependencies:
      - package: AstroCore
      - package: ContentKit
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YD3FY9ZB52
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoguiwk.interstellar
        PRODUCT_NAME: Interstellar
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Interstellar
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Interstellar uses your location only when you request it, to calculate local chart angles and houses.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: true
      testTargets:
        - InterstellarUITests
  InterstellarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Interstellar
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YD3FY9ZB52
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoguiwk.interstellar.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Interstellar
