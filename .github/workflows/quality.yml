name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: interstellar
          POSTGRES_USER: interstellar_owner
          POSTGRES_PASSWORD: ci-postgres-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interstellar_owner -d interstellar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTERSTELLAR_TEST_DATABASE_URL: postgresql://interstellar_owner:ci-postgres-secret@127.0.0.1:5432/interstellar
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check -r apps/api/requirements.lock -r requirements-dev.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Enforce public/private repository boundary
        run: scripts/check-private-content.sh

      - name: Validate architecture and iOS card contracts
        run: |
          npm run architecture:check
          scripts/check-ios-card-contract.sh

      - name: Validate private iOS copy catalogs
        env:
          INTERSTELLAR_COPY_CATALOG_EN_B64: ${{ secrets.INTERSTELLAR_COPY_CATALOG_EN_B64 }}
          INTERSTELLAR_COPY_CATALOG_ZH_HANS_B64: ${{ secrets.INTERSTELLAR_COPY_CATALOG_ZH_HANS_B64 }}
        run: npm run ios:copy:ci

      - name: Validate iOS UI localization and astrology terminology
        run: npm run ios:localization:validate

      - name: Validate Compose configuration
        env:
          INTERSTELLAR_POSTGRES_PASSWORD: ci-postgres-secret
          INTERSTELLAR_REDIS_PASSWORD: ci-redis-secret
          INTERSTELLAR_MINIO_ROOT_USER: ciadmin
          INTERSTELLAR_MINIO_ROOT_PASSWORD: ci-minio-root-secret
          INTERSTELLAR_MINIO_APP_ACCESS_KEY: ciappkey
          INTERSTELLAR_MINIO_APP_SECRET_KEY: ci-minio-app-secret
        run: docker compose -f compose.yaml config --quiet

      - name: Run M4 registry, recipe, jobs, API and SDK repository gate
        run: npm run m4:check
