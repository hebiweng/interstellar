<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Interstellar · Relay 管理</title>
  <style>
    :root{color-scheme:dark;--bg:#090b13;--panel:#131725;--line:#293047;--text:#f1f2f7;--muted:#9ca4bd;--violet:#9c7cff;--ok:#63dba0;--bad:#ff8e99}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#211a42 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}
    main{max-width:1040px;margin:auto;padding:28px 18px 70px}.top,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:22px}.brand{font-size:20px;font-weight:750;letter-spacing:.3px}.brand span{color:var(--violet)}
    .tabs{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}.tab,.btn{border:1px solid var(--line);background:#1b2031;color:var(--text);border-radius:10px;padding:9px 14px;cursor:pointer}.tab.active,.btn.primary{background:var(--violet);border-color:var(--violet);color:white}.btn.danger{color:#ffb1b8;border-color:#713943;background:#311c24}.btn:disabled{opacity:.45;cursor:not-allowed}
    .card{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 14px}.filters .card{margin:0}label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;background:#0c0f19;color:var(--text);padding:10px 11px;font:inherit}textarea{min-height:260px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
    .hint{color:var(--muted);font-size:12.5px}.status{padding:10px 12px;border-radius:10px;margin:0 0 14px}.status.ok{color:var(--ok);background:#10271f}.status.bad{color:var(--bad);background:#321a20}.badge{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 8px}.models{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.model{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 9px}.model.disabled{opacity:.5}.model input{width:auto}.feedback-content{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c0f19;border-radius:10px;padding:12px;margin:12px 0}.feedback-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}.login{max-width:390px;margin-top:12vh}@media(max-width:680px){.grid,.filters{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:14px}table{font-size:12px;display:block;overflow:auto}}
  </style>
</head>
<body><main id="app"></main>
<script>
const root=document.getElementById('app');
const API=location.hostname==='fate.xiaoguiwk.top'?'/xiaoguiwk-api':'';
const state={authenticated:null,tab:'providers',providers:[],prompts:[],usage:[],feedback:[],reports:[],users:[],userDetail:null,models:{},message:null,promptScope:'all',promptLocale:'all',feedbackStatus:'pending',feedbackType:'all',reportStatus:'',reportChart:'',reportLanguage:'',reportDate:'',reportUser:''};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,init={}){const r=await fetch(API+path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...init});let body={};try{body=await r.json()}catch{}if(!r.ok)throw new Error(body.error||`HTTP ${r.status}`);return body}
function message(ok,text){state.message={ok,text};render()}
function shell(content){return `<div class="top"><div class="brand">Interstellar <span>· Relay 管理</span></div><button class="btn danger" data-action="logout">退出</button></div><div class="tabs"><button class="tab ${state.tab==='providers'?'active':''}" data-tab="providers">Provider / 模型</button><button class="tab ${state.tab==='prompts'?'active':''}" data-tab="prompts">提示词</button><button class="tab ${state.tab==='usage'?'active':''}" data-tab="usage">用量</button><button class="tab ${state.tab==='reports'?'active':''}" data-tab="reports">Reports</button><button class="tab ${state.tab==='users'?'active':''}" data-tab="users">Users</button><button class="tab ${state.tab==='feedback'?'active':''}" data-tab="feedback">用户反馈</button></div>${state.message?`<div class="status ${state.message.ok?'ok':'bad'}">${esc(state.message.text)}</div>`:''}${content}`}
function login(){root.innerHTML=`<div class="login"><div class="brand">Interstellar <span>· Relay 管理</span></div><div class="card" style="margin-top:22px"><form id="login"><label>用户名</label><input name="username" autocomplete="username" required><label style="margin-top:12px">密码</label><input name="password" type="password" autocomplete="current-password" required><div id="login-error" class="hint" style="color:var(--bad);margin-top:10px"></div><button class="btn primary" style="margin-top:15px">登录</button></form></div></div>`}
function providerView(){return shell(`<div class="hint" style="margin-bottom:14px">DeepSeek 已预设为 <b>https://api.deepseek.com</b> 与 <b>deepseek-v4-flash</b>。通常只需填写 API Key、保存并测试连接。</div>${state.providers.map(providerCard).join('')}<button class="btn" data-action="add-provider">+ 添加 Provider</button>`)}
function providerCard(p){const models=state.models[p.id]||[];return `<section class="card" data-provider="${esc(p.id)}"><div class="row"><strong>${esc(p.label||p.id)}</strong><span class="badge">${esc(p.id)}</span><span class="badge">${p.api_key_set?'已配置 Key':'未配置 Key'}</span>${p.is_default?'<span class="badge">默认 Provider</span>':''}</div><div class="grid" style="margin-top:12px"><div><label>名称</label><input data-field="label" value="${esc(p.label)}"></div><div><label>Base URL</label><input data-field="base_url" value="${esc(p.base_url)}"></div><div class="wide"><label>API Key（留空不修改）</label><input data-field="api_key" type="password" placeholder="${p.api_key_set?'已保存；输入新 Key 可替换':'输入 DeepSeek API Key'}"></div><div><label>默认模型</label><input data-field="default_model" value="${esc(p.default_model)}"></div><div><label>路由状态</label><div class="row"><label style="margin:7px 0"><input style="width:auto" data-field="enabled" type="checkbox" ${p.enabled?'checked':''}> 启用 Provider</label><label style="margin:7px 0"><input style="width:auto" data-field="is_default" type="checkbox" ${p.is_default?'checked':''} ${p.enabled?'':'disabled'}> 设为默认</label></div></div></div>${models.length?`<div class="models">${models.map(m=>`<label class="model ${m.enabled?'':'disabled'}"><input type="checkbox" data-model="${esc(m.id)}" ${m.enabled?'checked':''}>${esc(m.id)}${m.is_default?' · 默认':''}</label>`).join('')}</div>`:''}<div class="row" style="margin-top:15px"><button class="btn primary" data-action="save-provider">保存</button><button class="btn" data-action="models">拉取模型</button><button class="btn" data-action="test-provider">测试连接</button><button class="btn danger" data-action="delete-provider">删除</button></div></section>`}
const scopeNames={'chart.natal':'本命','chart.current-sky':'天象','chart.transit':'行运','chart.secondary':'次限','chart.solar-return':'日返','chart.synastry':'合盘','period.daily':'每日报告','period.monthly':'月度报告','period.solar-return':'日返周期报告'};
const localeNames={'zh-Hans':'简体中文','en':'English'};
function promptView(){const scopes=[...new Set(state.prompts.map(p=>p.scope))];const locales=[...new Set(state.prompts.map(p=>p.locale))];const filtered=state.prompts.filter(p=>(state.promptScope==='all'||p.scope===state.promptScope)&&(state.promptLocale==='all'||p.locale===state.promptLocale));const groups={};for(const p of filtered)(groups[p.scope]??=[]).push(p);const filters=`<div class="filters"><div class="card"><label for="prompt-scope-filter">盘 / 报告</label><select id="prompt-scope-filter" data-prompt-filter="scope"><option value="all">全部盘与报告</option>${scopes.map(scope=>`<option value="${esc(scope)}" ${state.promptScope===scope?'selected':''}>${esc(scopeNames[scope]||scope)}</option>`).join('')}</select></div><div class="card"><label for="prompt-locale-filter">语言</label><select id="prompt-locale-filter" data-prompt-filter="locale"><option value="all">全部语言</option>${locales.map(locale=>`<option value="${esc(locale)}" ${state.promptLocale===locale?'selected':''}>${esc(localeNames[locale]||locale)}</option>`).join('')}</select></div></div>`;return shell(`<div class="hint" style="margin-bottom:14px">六盘 × 中英文提示词在首次启动时自动写入。可以修改并恢复默认；客户端只传计算事实，固定安全边界由默认模板提供。</div>${filters}<div class="hint" style="margin-bottom:10px">当前显示 ${filtered.length} / ${state.prompts.length} 份提示词</div>${Object.entries(groups).map(([scope,items])=>`<section class="card"><strong>${esc(scopeNames[scope]||scope)}</strong><span class="badge" style="margin-left:8px">${esc(scope)}</span>${items.map(p=>`<div style="margin-top:14px" data-prompt="${esc(p.scope)}|${esc(p.locale)}"><label>${esc(localeNames[p.locale]||p.locale)} · ${esc(p.locale)} · v${p.version} · ${esc(p.updated_at)}</label><textarea>${esc(p.system_prompt)}</textarea><div class="row" style="margin-top:9px"><button class="btn primary" data-action="save-prompt">保存</button><button class="btn" data-action="restore-prompt">恢复默认</button></div></div>`).join('')}</section>`).join('')||'<div class="card hint">当前筛选条件下没有提示词。</div>'}`)}
function usageView(){return shell(`<section class="card"><table><thead><tr><th>日期</th><th>模型</th><th>请求</th><th>错误</th><th>成功率</th><th>输入 Token</th><th>输出 Token</th></tr></thead><tbody>${state.usage.map(r=>`<tr><td>${esc(r.day)}</td><td>${esc(r.model)}</td><td>${r.requests}</td><td>${r.errors}</td><td>${Math.round(r.success_rate*100)}%</td><td>${r.prompt_tokens}</td><td>${r.completion_tokens}</td></tr>`).join('')||'<tr><td colspan="7" class="hint">暂无数据</td></tr>'}</tbody></table></section>`)}
function reportsView(){const filters=`<div class="filters"><div class="card"><label>状态</label><select data-report-filter="status"><option value="">全部</option>${['processing','awaiting_ack','success','failed'].map(v=>`<option ${state.reportStatus===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="card"><label>盘 / 报告</label><input data-report-filter="chart" value="${esc(state.reportChart)}" placeholder="chart.natal"></div><div class="card"><label>语言</label><input data-report-filter="language" value="${esc(state.reportLanguage)}" placeholder="zh-Hans / en"></div><div class="card"><label>日期</label><input type="date" data-report-filter="date" value="${esc(state.reportDate)}"></div><div class="card wide"><label>User UUID</label><input data-report-filter="user" value="${esc(state.reportUser)}" placeholder="精确匹配"></div></div>`;return shell(`${filters}<section class="card"><table><thead><tr><th>时间</th><th>Report / Request</th><th>User</th><th>Chart</th><th>语言</th><th>模型</th><th>Tokens</th><th>耗时</th><th>状态</th><th>Credit</th><th>Error</th></tr></thead><tbody>${state.reports.map(r=>`<tr><td>${esc(r.createdAt)}</td><td>${esc(r.reportID)}<br><span class="hint">${esc(r.requestID)}</span></td><td>${esc(r.userID)}</td><td>${esc(r.chartType)}</td><td>${esc(r.requestedLocale)} → ${esc(r.effectiveLocale)}</td><td>${esc(r.model)}</td><td>${r.inputTokens+r.outputTokens+r.reasoningTokens}</td><td>${r.durationMs}ms</td><td>${esc(r.reportStatus)}</td><td>${r.creditCost} · ${esc(r.creditStatus)}</td><td>${esc(r.errorCode||'')} ${esc(r.errorMessage||'')}</td></tr>`).join('')||'<tr><td colspan="11">暂无报告</td></tr>'}</tbody></table></section>`)}
function usersView(){const grants=state.userDetail?.creditGrants||[];const detail=state.userDetail?`<section class="card"><strong>User Detail</strong><div class="grid" style="margin-top:12px"><div><label>User ID</label>${esc(state.userDetail.userID)}</div><div><label>Plan</label>${esc(state.userDetail.plan)}</div><div><label>Registered / Last Active</label>${esc(state.userDetail.createdAt)} · ${esc(state.userDetail.lastActiveAt)}</div><div><label>Apple Subscription</label>${esc(state.userDetail.appleProductID||'—')} · ${esc(state.userDetail.appleSubscriptionStatus||'—')}</div><div><label>Apple / Admin 到期</label>${esc(state.userDetail.applePremiumExpiresAt||'—')} · ${esc(state.userDetail.adminPremiumExpiresAt||'—')}</div><div><label>Reports</label>${state.userDetail.reportsGenerated}</div><div class="wide"><label>Credits</label>Allowance ${state.userDetail.credits.allowance} · Bonus ${state.userDetail.credits.bonus} · Purchased ${state.userDetail.credits.purchased} · Reserved ${state.userDetail.credits.reserved} · Total ${state.userDetail.credits.total}</div><div class="wide"><label>Credit Grants</label>${grants.map(g=>`${esc(g.source)} ${g.remaining}/${g.original} · ${esc(g.grantedAt)}${g.expiresAt?' → '+esc(g.expiresAt):''}`).join('<br>')||'—'}</div></div></section>`:'';return shell(`${detail}${state.users.map(u=>`<section class="card" data-user="${esc(u.userID)}"><div class="row"><strong>${esc(u.userID)}</strong><span class="badge">${esc(u.plan)}</span><span class="badge">Credits ${u.credits.total}</span></div><div class="hint">注册 ${esc(u.createdAt)} · 最近活跃 ${esc(u.lastActiveAt)} · Reports ${u.reportsGenerated}</div><div class="row" style="margin-top:12px"><button class="btn" data-action="user-detail">详情</button><button class="btn" data-action="user-reports">Reports</button><button class="btn" data-action="grant-premium">Grant Premium</button><button class="btn" data-action="grant-credits">Grant Credits</button></div></section>`).join('')||'<div class="card">暂无用户</div>'}`)}
const feedbackTypeNames={bug:'Bug',feature:'功能建议',other:'其他'};
function feedbackView(){const filters=`<div class="filters"><div class="card"><label for="feedback-status-filter">处理状态</label><select id="feedback-status-filter" data-feedback-filter="status"><option value="all" ${state.feedbackStatus==='all'?'selected':''}>全部状态</option><option value="pending" ${state.feedbackStatus==='pending'?'selected':''}>待处理</option><option value="resolved" ${state.feedbackStatus==='resolved'?'selected':''}>已处理</option></select></div><div class="card"><label for="feedback-type-filter">反馈类型</label><select id="feedback-type-filter" data-feedback-filter="type"><option value="all" ${state.feedbackType==='all'?'selected':''}>全部类型</option><option value="bug" ${state.feedbackType==='bug'?'selected':''}>Bug</option><option value="feature" ${state.feedbackType==='feature'?'selected':''}>功能建议</option><option value="other" ${state.feedbackType==='other'?'selected':''}>其他</option></select></div></div>`;return shell(`<div class="hint" style="margin-bottom:14px">这里接收 App 主动提交的反馈。内容与联系方式加密存储，不包含出生资料、星盘或 AI 报告正文。</div>${filters}<div class="hint" style="margin-bottom:10px">当前 ${state.feedback.length} 条</div>${state.feedback.map(item=>`<section class="card" data-feedback="${item.id}"><div class="feedback-meta"><strong>${esc(feedbackTypeNames[item.type]||item.type)}</strong><span class="badge">${item.status==='resolved'?'已处理':'待处理'}</span><span class="hint">${esc(item.createdAt)}</span></div><div class="feedback-content">${esc(item.content)}</div>${item.contact?`<div class="hint">联系方式：${esc(item.contact)}</div>`:''}<div class="row" style="margin-top:12px"><button class="btn ${item.status==='pending'?'primary':''}" data-action="feedback-status" data-status="${item.status==='pending'?'resolved':'pending'}">${item.status==='pending'?'标记已处理':'重新打开'}</button></div></section>`).join('')||'<div class="card hint">当前筛选条件下暂无反馈。</div>'}`)}
function render(){if(state.authenticated===false)return login();if(state.authenticated!==true){root.innerHTML='';return}root.innerHTML=state.tab==='providers'?providerView():state.tab==='prompts'?promptView():state.tab==='usage'?usageView():state.tab==='reports'?reportsView():state.tab==='users'?usersView():feedbackView()}
async function load(tab=state.tab){state.tab=tab;state.message=null;try{if(tab==='providers')state.providers=(await api('/admin/providers')).providers||[];if(tab==='prompts')state.prompts=(await api('/admin/prompts')).prompts||[];if(tab==='usage')state.usage=(await api('/admin/usage')).usage||[];if(tab==='reports'){const q=new URLSearchParams();if(state.reportStatus)q.set('status',state.reportStatus);if(state.reportChart)q.set('chartType',state.reportChart);if(state.reportLanguage)q.set('language',state.reportLanguage);if(state.reportDate)q.set('date',state.reportDate);if(state.reportUser)q.set('userID',state.reportUser);state.reports=(await api('/admin/reports?'+q)).items||[]}if(tab==='users')state.users=(await api('/admin/users')).items||[];if(tab==='feedback'){const q=new URLSearchParams();if(state.feedbackStatus!=='all')q.set('status',state.feedbackStatus);if(state.feedbackType!=='all')q.set('type',state.feedbackType);state.feedback=(await api('/admin/feedback?'+q)).items||[]}render()}catch(e){if(String(e.message).includes('unauthorized')){state.authenticated=false;render()}else message(false,e.message)}}
root.addEventListener('submit',async e=>{if(e.target.id!=='login')return;e.preventDefault();const data=new FormData(e.target);try{await api('/admin/login',{method:'POST',body:JSON.stringify({username:data.get('username'),password:data.get('password')})});state.authenticated=true;await load('providers')}catch(err){document.getElementById('login-error').textContent=err.message}});
root.addEventListener('click',async e=>{const button=e.target.closest('button');if(!button)return;const tab=button.dataset.tab;if(tab){await load(tab);return}const action=button.dataset.action;if(!action)return;try{if(action==='logout'){await api('/admin/logout',{method:'POST'});state.authenticated=false;render();return}const feedbackCard=button.closest('[data-feedback]');if(feedbackCard&&action==='feedback-status'){await api(`/admin/feedback/${feedbackCard.dataset.feedback}`,{method:'PATCH',body:JSON.stringify({status:button.dataset.status})});await load('feedback');message(true,'反馈状态已更新');return}if(action==='add-provider'){const id=prompt('Provider ID');if(!id)return;state.providers.push({id,label:id,base_url:'https://api.deepseek.com',api_key_set:false,default_model:'deepseek-v4-flash',enabled:true,is_default:false});render();return}const card=button.closest('[data-provider]');if(card){const id=card.dataset.provider;const p=state.providers.find(x=>x.id===id);if(action==='delete-provider'){if(confirm(`删除 ${id}？`)){await api(`/admin/providers/${encodeURIComponent(id)}`,{method:'DELETE'});await load('providers')}return}if(action==='models'){state.models[id]=(await api(`/admin/providers/${encodeURIComponent(id)}/models`)).models||[];render();return}if(action==='test-provider'){const result=await api(`/admin/providers/${encodeURIComponent(id)}/test`,{method:'POST'});message(true,`${id} 连接正常：${result.model}`);return}if(action==='save-provider'){const get=n=>card.querySelector(`[data-field="${n}"]`);await api('/admin/providers',{method:'PUT',body:JSON.stringify({id,label:get('label').value,base_url:get('base_url').value,api_key:get('api_key').value,default_model:get('default_model').value,enabled:get('enabled').checked,is_default:get('is_default').checked})});await load('providers');message(true,`${id} 已保存`);return}}const promptBox=button.closest('[data-prompt]');if(promptBox){const [scope,locale]=promptBox.dataset.prompt.split('|');if(action==='save-prompt')await api('/admin/prompts',{method:'PUT',body:JSON.stringify({scope,locale,system_prompt:promptBox.querySelector('textarea').value})});if(action==='restore-prompt'&&confirm(`恢复 ${scope} / ${locale} 默认提示词？`))await api(`/admin/prompts/${scope}/${locale}/restore`,{method:'POST'});await load('prompts');message(true,`${scope} / ${locale} 已更新`)}}catch(err){message(false,err.message)}});
root.addEventListener('change',async e=>{const promptFilter=e.target.dataset.promptFilter;if(promptFilter){if(promptFilter==='scope')state.promptScope=e.target.value;if(promptFilter==='locale')state.promptLocale=e.target.value;render();return}const reportFilter=e.target.dataset.reportFilter;if(reportFilter){state['report'+reportFilter[0].toUpperCase()+reportFilter.slice(1)]=e.target.value.trim();await load('reports');return}const feedbackFilter=e.target.dataset.feedbackFilter;if(feedbackFilter){if(feedbackFilter==='status')state.feedbackStatus=e.target.value;if(feedbackFilter==='type')state.feedbackType=e.target.value;await load('feedback');return}const model=e.target.dataset.model;if(!model)return;const card=e.target.closest('[data-provider]');try{await api('/admin/models',{method:'PUT',body:JSON.stringify({provider_id:card.dataset.provider,model_id:model,enabled:e.target.checked})});state.models[card.dataset.provider]=(await api(`/admin/providers/${encodeURIComponent(card.dataset.provider)}/models`)).models||[];render()}catch(err){message(false,err.message)}});
(async()=>{try{await api('/admin/session');state.authenticated=true;await load('providers')}catch{state.authenticated=false;render()}})();
</script><script>
root.addEventListener('click',async e=>{const b=e.target.closest('button'),card=b&&b.closest('[data-user]');if(!card)return;try{if(b.dataset.action==='user-detail'){state.userDetail=await api(`/admin/users/${card.dataset.user}`);render()}if(b.dataset.action==='user-reports'){state.reportUser=card.dataset.user;await load('reports')}if(b.dataset.action==='grant-credits'){const amount=Number(prompt('Credits amount','10'));if(amount>0)await api(`/admin/users/${card.dataset.user}/credits`,{method:'POST',body:JSON.stringify({amount})});await load('users')}if(b.dataset.action==='grant-premium'){const suggested=new Date(Date.now()+30*86400000).toISOString();const entered=prompt('Expiration (ISO-8601); leave empty to revoke',suggested);if(entered===null)return;const reason=prompt('Reason','Admin console')||'Admin console';await api(`/admin/users/${card.dataset.user}/premium`,{method:'POST',body:JSON.stringify({expiresAt:entered.trim(),reason})});await load('users')}}catch(err){message(false,err.message)}});
</script></body></html>
