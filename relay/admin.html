<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Interstellar · Relay 管理</title>
  <style>
    :root{color-scheme:dark;--bg:#090b13;--panel:#131725;--line:#293047;--text:#f1f2f7;--muted:#9ca4bd;--violet:#9c7cff;--ok:#63dba0;--bad:#ff8e99}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#211a42 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}
    main{max-width:1040px;margin:auto;padding:28px 18px 70px}.top,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:22px}.brand{font-size:20px;font-weight:750;letter-spacing:.3px}.brand span{color:var(--violet)}
    .tabs{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}.tab,.btn{border:1px solid var(--line);background:#1b2031;color:var(--text);border-radius:10px;padding:9px 14px;cursor:pointer}.tab.active,.btn.primary{background:var(--violet);border-color:var(--violet);color:white}.btn.danger{color:#ffb1b8;border-color:#713943;background:#311c24}.btn:disabled{opacity:.45;cursor:not-allowed}
    .card{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;background:#0c0f19;color:var(--text);padding:10px 11px;font:inherit}textarea{min-height:260px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
    .hint{color:var(--muted);font-size:12.5px}.status{padding:10px 12px;border-radius:10px;margin:0 0 14px}.status.ok{color:var(--ok);background:#10271f}.status.bad{color:var(--bad);background:#321a20}.badge{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 8px}.models{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.model{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 9px}.model.disabled{opacity:.5}.model input{width:auto}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}.login{max-width:390px;margin-top:12vh}@media(max-width:680px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:14px}table{font-size:12px;display:block;overflow:auto}}
  </style>
</head>
<body><main id="app"></main>
<script>
const root=document.getElementById('app');
const API=location.hostname==='fate.xiaoguiwk.top'?'/xiaoguiwk-api':'';
const state={authenticated:null,tab:'providers',providers:[],prompts:[],usage:[],models:{},message:null};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,init={}){const r=await fetch(API+path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...init});let body={};try{body=await r.json()}catch{}if(!r.ok)throw new Error(body.error||`HTTP ${r.status}`);return body}
function message(ok,text){state.message={ok,text};render()}
function shell(content){return `<div class="top"><div class="brand">Interstellar <span>· Relay 管理</span></div><button class="btn danger" data-action="logout">退出</button></div><div class="tabs"><button class="tab ${state.tab==='providers'?'active':''}" data-tab="providers">Provider / 模型</button><button class="tab ${state.tab==='prompts'?'active':''}" data-tab="prompts">提示词</button><button class="tab ${state.tab==='usage'?'active':''}" data-tab="usage">用量</button></div>${state.message?`<div class="status ${state.message.ok?'ok':'bad'}">${esc(state.message.text)}</div>`:''}${content}`}
function login(){root.innerHTML=`<div class="login"><div class="brand">Interstellar <span>· Relay 管理</span></div><div class="card" style="margin-top:22px"><form id="login"><label>用户名</label><input name="username" autocomplete="username" required><label style="margin-top:12px">密码</label><input name="password" type="password" autocomplete="current-password" required><div id="login-error" class="hint" style="color:var(--bad);margin-top:10px"></div><button class="btn primary" style="margin-top:15px">登录</button></form></div></div>`}
function providerView(){return shell(`<div class="hint" style="margin-bottom:14px">DeepSeek 已预设为 <b>https://api.deepseek.com</b> 与 <b>deepseek-v4-flash</b>。通常只需填写 API Key、保存并测试连接。</div>${state.providers.map(providerCard).join('')}<button class="btn" data-action="add-provider">+ 添加 Provider</button>`)}
function providerCard(p){const models=state.models[p.id]||[];return `<section class="card" data-provider="${esc(p.id)}"><div class="row"><strong>${esc(p.label||p.id)}</strong><span class="badge">${esc(p.id)}</span><span class="badge">${p.api_key_set?'已配置 Key':'未配置 Key'}</span>${p.is_default?'<span class="badge">默认 Provider</span>':''}</div><div class="grid" style="margin-top:12px"><div><label>名称</label><input data-field="label" value="${esc(p.label)}"></div><div><label>Base URL</label><input data-field="base_url" value="${esc(p.base_url)}"></div><div class="wide"><label>API Key（留空不修改）</label><input data-field="api_key" type="password" placeholder="${p.api_key_set?'已保存；输入新 Key 可替换':'输入 DeepSeek API Key'}"></div><div><label>默认模型</label><input data-field="default_model" value="${esc(p.default_model)}"></div><div><label>路由状态</label><div class="row"><label style="margin:7px 0"><input style="width:auto" data-field="enabled" type="checkbox" ${p.enabled?'checked':''}> 启用 Provider</label><label style="margin:7px 0"><input style="width:auto" data-field="is_default" type="checkbox" ${p.is_default?'checked':''} ${p.enabled?'':'disabled'}> 设为默认</label></div></div></div>${models.length?`<div class="models">${models.map(m=>`<label class="model ${m.enabled?'':'disabled'}"><input type="checkbox" data-model="${esc(m.id)}" ${m.enabled?'checked':''}>${esc(m.id)}${m.is_default?' · 默认':''}</label>`).join('')}</div>`:''}<div class="row" style="margin-top:15px"><button class="btn primary" data-action="save-provider">保存</button><button class="btn" data-action="models">拉取模型</button><button class="btn" data-action="test-provider">测试连接</button><button class="btn danger" data-action="delete-provider">删除</button></div></section>`}
function promptView(){const groups={};for(const p of state.prompts)(groups[p.scope]??=[]).push(p);return shell(`<div class="hint" style="margin-bottom:14px">六盘 × 中英文提示词在首次启动时自动写入。可以修改并恢复默认；客户端只传计算事实，固定安全边界由默认模板提供。</div>${Object.entries(groups).map(([scope,items])=>`<section class="card"><strong>${esc(scope)}</strong>${items.map(p=>`<div style="margin-top:14px" data-prompt="${esc(p.scope)}|${esc(p.locale)}"><label>${esc(p.locale)} · v${p.version} · ${esc(p.updated_at)}</label><textarea>${esc(p.system_prompt)}</textarea><div class="row" style="margin-top:9px"><button class="btn primary" data-action="save-prompt">保存</button><button class="btn" data-action="restore-prompt">恢复默认</button></div></div>`).join('')}</section>`).join('')||'<div class="card hint">暂无提示词，检查 RELAY_SEED_PROMPTS。</div>'}`)}
function usageView(){return shell(`<section class="card"><table><thead><tr><th>日期</th><th>模型</th><th>请求</th><th>错误</th><th>成功率</th><th>输入 Token</th><th>输出 Token</th></tr></thead><tbody>${state.usage.map(r=>`<tr><td>${esc(r.day)}</td><td>${esc(r.model)}</td><td>${r.requests}</td><td>${r.errors}</td><td>${Math.round(r.success_rate*100)}%</td><td>${r.prompt_tokens}</td><td>${r.completion_tokens}</td></tr>`).join('')||'<tr><td colspan="7" class="hint">暂无数据</td></tr>'}</tbody></table></section>`)}
function render(){if(state.authenticated===false)return login();if(state.authenticated!==true){root.innerHTML='';return}root.innerHTML=state.tab==='providers'?providerView():state.tab==='prompts'?promptView():usageView()}
async function load(tab=state.tab){state.tab=tab;state.message=null;try{if(tab==='providers')state.providers=(await api('/admin/providers')).providers||[];if(tab==='prompts')state.prompts=(await api('/admin/prompts')).prompts||[];if(tab==='usage')state.usage=(await api('/admin/usage')).usage||[];render()}catch(e){if(String(e.message).includes('unauthorized')){state.authenticated=false;render()}else message(false,e.message)}}
root.addEventListener('submit',async e=>{if(e.target.id!=='login')return;e.preventDefault();const data=new FormData(e.target);try{await api('/admin/login',{method:'POST',body:JSON.stringify({username:data.get('username'),password:data.get('password')})});state.authenticated=true;await load('providers')}catch(err){document.getElementById('login-error').textContent=err.message}});
root.addEventListener('click',async e=>{const button=e.target.closest('button');if(!button)return;const tab=button.dataset.tab;if(tab){await load(tab);return}const action=button.dataset.action;if(!action)return;try{if(action==='logout'){await api('/admin/logout',{method:'POST'});state.authenticated=false;render();return}if(action==='add-provider'){const id=prompt('Provider ID');if(!id)return;state.providers.push({id,label:id,base_url:'https://api.deepseek.com',api_key_set:false,default_model:'deepseek-v4-flash',enabled:true,is_default:false});render();return}const card=button.closest('[data-provider]');if(card){const id=card.dataset.provider;const p=state.providers.find(x=>x.id===id);if(action==='delete-provider'){if(confirm(`删除 ${id}？`)){await api(`/admin/providers/${encodeURIComponent(id)}`,{method:'DELETE'});await load('providers')}return}if(action==='models'){state.models[id]=(await api(`/admin/providers/${encodeURIComponent(id)}/models`)).models||[];render();return}if(action==='test-provider'){const result=await api(`/admin/providers/${encodeURIComponent(id)}/test`,{method:'POST'});message(true,`${id} 连接正常：${result.model}`);return}if(action==='save-provider'){const get=n=>card.querySelector(`[data-field="${n}"]`);await api('/admin/providers',{method:'PUT',body:JSON.stringify({id,label:get('label').value,base_url:get('base_url').value,api_key:get('api_key').value,default_model:get('default_model').value,enabled:get('enabled').checked,is_default:get('is_default').checked})});await load('providers');message(true,`${id} 已保存`);return}}const promptBox=button.closest('[data-prompt]');if(promptBox){const [scope,locale]=promptBox.dataset.prompt.split('|');if(action==='save-prompt')await api('/admin/prompts',{method:'PUT',body:JSON.stringify({scope,locale,system_prompt:promptBox.querySelector('textarea').value})});if(action==='restore-prompt'&&confirm(`恢复 ${scope} / ${locale} 默认提示词？`))await api(`/admin/prompts/${scope}/${locale}/restore`,{method:'POST'});await load('prompts');message(true,`${scope} / ${locale} 已更新`)}}catch(err){message(false,err.message)}});
root.addEventListener('change',async e=>{const model=e.target.dataset.model;if(!model)return;const card=e.target.closest('[data-provider]');try{await api('/admin/models',{method:'PUT',body:JSON.stringify({provider_id:card.dataset.provider,model_id:model,enabled:e.target.checked})});state.models[card.dataset.provider]=(await api(`/admin/providers/${encodeURIComponent(card.dataset.provider)}/models`)).models||[];render()}catch(err){message(false,err.message)}});
(async()=>{try{await api('/admin/session');state.authenticated=true;await load('providers')}catch{state.authenticated=false;render()}})();
</script></body></html>
