name: interstellar-production

x-runtime-defaults: &runtime-defaults
  restart: unless-stopped
  init: true
  stop_grace_period: 20s
  security_opt:
    - no-new-privileges:true
  networks:
    - interstellar-internal
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  edge:
    <<: *runtime-defaults
    container_name: interstellar-edge
    image: caddy:2-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    depends_on:
      interstellar-relay:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.fate:/etc/caddy/Caddyfile:ro
      - interstellar-caddy-data:/data
      - interstellar-caddy-config:/config
    mem_limit: 128m
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  interstellar-relay:
    <<: *runtime-defaults
    container_name: interstellar-relay
    image: interstellar-relay:${INTERSTELLAR_IMAGE_TAG:-latest}
    environment:
      RELAY_ADDR: ":8080"
      RELAY_DB_PATH: /data/relay.db
      RELAY_SECRET: ${RELAY_SECRET:?set RELAY_SECRET in .env}
      RELAY_ADMIN_USER: ${RELAY_ADMIN_USER:?set a random RELAY_ADMIN_USER in .env}
      RELAY_ADMIN_PASS: ${RELAY_ADMIN_PASS:?set RELAY_ADMIN_PASS in .env}
      RELAY_PRUNE_OTHER_ADMINS: "1"
      RELAY_SEED_PROMPTS: "1"
      RELAY_SEED_DEEPSEEK: "0"
      RELAY_ALLOWED_ORIGIN: https://aaadmin.xiaoguiwk.top
      RELAY_DAILY_GENERATION_QUOTA: ${RELAY_DAILY_GENERATION_QUOTA:-20}
      # Temporary: App Attest is disabled while the Apple Developer Program is not purchased.
      RELAY_ALLOW_DEV_BYPASS: "1"
      RELAY_APP_ATTEST_APP_ID: YD3FY9ZB52.com.xiaoguiwk.interstellar
      RELAY_APP_ATTEST_ENVIRONMENT: production
      RELAY_APP_ATTEST_ALLOW_DEVELOPMENT: "1"
      RELAY_APP_ATTEST_BUNDLE_VERSION: "1"
      RELAY_HEALTH_URL: http://127.0.0.1:8080/v1/health
    expose:
      - "8080"
    volumes:
      - relay-data:/data
    mem_limit: 192m
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/app/relay", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  interstellar-internal:
    name: interstellar-internal
    driver: bridge
    attachable: true

volumes:
  interstellar-caddy-data:
  interstellar-caddy-config:
  relay-data:
