name: interstellar-production

x-runtime-defaults: &runtime-defaults
  restart: unless-stopped
  init: true
  stop_grace_period: 20s
  security_opt:
    - no-new-privileges:true
  networks:
    - interstellar-internal
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *runtime-defaults
    container_name: interstellar-web
    image: interstellar-web:${INTERSTELLAR_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.web
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    mem_limit: 384m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    <<: *runtime-defaults
    container_name: interstellar-api
    image: interstellar-api:${INTERSTELLAR_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.api
    environment:
      INTERSTELLAR_ENVIRONMENT: production
      INTERSTELLAR_API_HOST: 0.0.0.0
      INTERSTELLAR_API_PORT: "8018"
      INTERSTELLAR_BUILD_COMMIT: ${INTERSTELLAR_BUILD_COMMIT:-unknown}
      INTERSTELLAR_LOG_LEVEL: INFO
      INTERSTELLAR_CORS_ALLOWED_ORIGINS: https://fate.xiaoguiwk.top
      INTERSTELLAR_ACCOUNT_DATABASE_PATH: /var/lib/interstellar/accounts.sqlite3
      # Small-memory production profile: timezone selection uses the official
      # GeoNames IANA hint and remains user-confirmed. Mount the full TBB
      # archive and override these two variables only on hosts with >=4 GiB.
      INTERSTELLAR_TIMEZONE_BOUNDARIES_PATH: ${INTERSTELLAR_TIMEZONE_BOUNDARIES_PATH:-/opt/interstellar/deploy-data/timezone-boundaries-geonames-fallback.geojson}
      INTERSTELLAR_TIMEZONE_BOUNDARIES_DATASET_VERSION: ${INTERSTELLAR_TIMEZONE_BOUNDARIES_DATASET_VERSION:-geonames-hint-only-v1}
      INTERSTELLAR_AUTH_COOKIE_NAME: interstellar_session
      INTERSTELLAR_AUTH_SESSION_DAYS: "30"
      INTERSTELLAR_AUTH_COOKIE_SECURE: "true"
      INTERSTELLAR_ADMIN_BOOTSTRAP_EMAIL: ${INTERSTELLAR_ADMIN_BOOTSTRAP_EMAIL:-}
      INTERSTELLAR_ADMIN_BOOTSTRAP_PASSWORD: ${INTERSTELLAR_ADMIN_BOOTSTRAP_PASSWORD:-}
      INTERSTELLAR_ADMIN_MASTER_KEY: ${INTERSTELLAR_ADMIN_MASTER_KEY:-}
      INTERSTELLAR_DEEPSEEK_API_KEY: ${INTERSTELLAR_DEEPSEEK_API_KEY:-}
      INTERSTELLAR_DEEPSEEK_BASE_URL: ${INTERSTELLAR_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      INTERSTELLAR_DEEPSEEK_MODEL: ${INTERSTELLAR_DEEPSEEK_MODEL:-deepseek-v4-pro}
    expose:
      - "8018"
    mem_limit: 1024m
    pids_limit: 192
    volumes:
      - ${INTERSTELLAR_DATA_DIR:-/opt/interstellar/data}:/var/lib/interstellar
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL

networks:
  interstellar-internal:
    name: interstellar-internal
    driver: bridge
    attachable: true
