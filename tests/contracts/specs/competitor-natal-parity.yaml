parity_policy:
  comparison_unit: information_dimensions_and_declared_inventory
  point_inventory_rule: every_source_row_must_be_accounted_for_without_fabricating_unknown_formulas
  house_rule: all_12_cusps_and_their_source_fields_must_be_representable
  aspect_rule: source_geometry_set_must_be_a_subset_of_the_selected_interstellar_profile
  aspect_count_is_release_floor: false
  aspect_count_rationale:
    - matched_count_changes_with_selected_point_set
    - matched_count_changes_with_aspect_set
    - matched_count_changes_with_orb_profile_and_overrides
    - a_larger_count_does_not_prove_more_accurate_geometry
  aspect_quality_gates:
    - deterministic_pair_evaluation
    - no_duplicate_point_pair_and_aspect_type
    - exact_and_actual_angles
    - orb_and_orb_ratio
    - applying_state_and_direction
    - versioned_aspect_and_orb_profiles
    - rule_references_and_reproducibility
  target_executable_source_point_rows: 66
  current_executable_source_point_rows: 41
  release_status: blocked

