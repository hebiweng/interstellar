[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "interstellar-core"
version = "0.1.0"
description = "Framework-independent Interstellar domain and application boundaries"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pysweph==2.10.3.6",
  "PyYAML==6.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["interstellar_core"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"interstellar_core/persistence/schema.py" = ["E501"]
