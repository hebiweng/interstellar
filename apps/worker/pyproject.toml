[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "interstellar-worker"
version = "0.1.0"
description = "Interstellar background worker foundation"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "ruff==0.15.13",
]

[project.scripts]
interstellar-worker = "interstellar_worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["interstellar_worker"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
