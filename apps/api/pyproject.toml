[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "interstellar-api"
version = "0.1.0"
description = "Interstellar versioned HTTP API foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.136.1",
  "pydantic==2.13.3",
  "psycopg[binary]==3.3.4",
  "pysweph==2.10.3.6",
  "PyYAML==6.0.3",
  "sqlalchemy==2.0.51",
  "tzdata==2026.3",
  "uvicorn==0.46.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.3",
  "ruff==0.15.13",
]

[tool.hatch.build.targets.wheel]
packages = ["interstellar_api"]

[tool.pytest.ini_options]
testpaths = ["../../tests/backend"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
